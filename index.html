<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Sign</title>
    <link rel="icon" type="image/png" href="static/logo.png" />
    <link href="https://gcore.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <script src="https://gcore.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link data-trunk rel="css" href="./main.css">
    <link data-trunk rel="copy-dir" href="static">
    <link data-trunk rel="copy-dir" href="js_utils">

    <link data-trunk rel="copy-file" href="service_worker.js">
    <link data-trunk rel="copy-file" href="manifest.json">
    <link rel="manifest" href="manifest.json">

    <link data-trunk rel="rust" data-wasm-opt="s">

    <script type="module">
        // register ServiceWorker as module so we can use ES module import
        window.onload = () => {
            'use strict';

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./service_worker.js', { type: 'module' });
            }
        }
    </script>
</head>

<body></body>

</html>
